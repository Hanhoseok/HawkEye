# 구역 정의 — store-aisle-detection.mp4 기준
#
# 좌표는 0~1 상대값이다. 픽셀 대신 상대값을 쓰는 이유:
#   처리 해상도를 바꾸면(--scale 실험 등) 픽셀 좌표가 전부 어긋난다.
#
# 좌표를 새로 정할 때:
#   python scripts/export_frame.py <영상> --frame <번호>
#   격자가 입혀진 프레임이 저장되고, 라벨은 '상대좌표|픽셀' 형식이다.
#
# 구역 타입별 판정 방식 (src/zones/zone_map.py):
#   SHELF            -> 사람 bbox 와의 겹침 비율. 사람은 선반 '안에' 서지 않으므로.
#   EXIT / CHECKOUT  -> 발 위치(bbox 아래쪽 중앙)가 구역 안에 있는지.

normalized: true

zones:
  # 왼쪽 벽면 선반 (접시·컵)
  - name: shelf_left
    type: SHELF
    polygon: [[0.00, 0.00], [0.21, 0.00], [0.19, 1.00], [0.00, 1.00]]

  # 오른쪽 벽면 선반 (그릇). 원근 때문에 아래로 갈수록 안쪽으로 들어온다
  - name: shelf_right
    type: SHELF
    polygon: [[0.60, 0.00], [1.00, 0.00], [1.00, 1.00], [0.74, 1.00]]

  # 통로 가운데 진열대 (접시·주전자). 아래로 갈수록 넓어진다
  - name: display_center
    type: SHELF
    polygon: [[0.27, 0.28], [0.55, 0.28], [0.62, 1.00], [0.12, 1.00]]

  # 통로 안쪽 끝 = 매장 다른 구역으로 나가는 방향
  # 주의: 이 영상에 실제 출구가 없어 임의로 지정한 것이다. 검증은 인위적이다.
  - name: exit_far
    type: EXIT
    polygon: [[0.30, 0.00], [0.56, 0.00], [0.56, 0.11], [0.30, 0.11]]
