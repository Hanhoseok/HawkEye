# MERL Shopping 구역 — 920x680, 천장 거의 수직 시점
#
# === 이 좌표는 눈으로 그린 것이 아니라 train 데이터에서 뽑은 것이다 ===
#
# 처음에는 프레임 하나를 보고 "상품이 보이는 곳"을 선반으로 그렸다. 그런데
# train 20개 영상에서 '손 뻗기/선반 안' 구간의 손목 위치를 모아 보니,
# 손이 실제로 가는 곳은 **상품이 보이는 곳이 아니라 선반 앞쪽 가장자리**였다.
# (위에서 내려다보면 상품은 선반 안쪽에 보이지만, 손은 앞 가장자리까지만 간다)
#
# 손뻗기 vs 구경의 손목 분포를 격자로 비교한 결과:
#   손뻗기 우세(75% 이상) 칸 97개 -> 손뻗기 5,284건 vs 구경 225건 (23:1)
#   그 칸들은 y 0.33~0.52 의 가로 띠에 모여 있었다. 구경은 그 아래(y 0.52~0.80).
#
# 근거: outputs/frames/merl_reach_vs_browse.png (빨강=손뻗기, 파랑=구경)
# 주의: test subject(27~41)는 이 좌표를 정하는 데 쓰지 않았다.

normalized: true

zones:
  # 선반 앞 가장자리 — 손이 실제로 닿는 띠
  - name: shelf_front
    type: SHELF
    polygon: [[0.32, 0.33], [0.86, 0.33], [0.86, 0.53], [0.32, 0.53]]

  # 오른쪽 선반 (조금 더 위쪽까지 손이 올라간다)
  - name: shelf_right
    type: SHELF
    polygon: [[0.80, 0.25], [0.98, 0.25], [0.98, 0.50], [0.80, 0.50]]
