# 절도 위험 탐지 시스템 · 1차 구현 설정
# 임계값과 모델 경로는 코드에 하드코딩하지 않고 여기서만 관리한다. (05 아키텍처 §4)

video:
  source: data/videos/sample.mp4
  start_time: null      # ISO8601 (예: "2026-09-20T14:00:00+09:00"). null 이면 실행 시각 기준
  start_frame: 0        # 이 프레임부터 처리. 특정 구간만 실험할 때 사용
  max_frames: null      # 디버깅용 조기 종료. null 이면 끝까지
  stride: 1             # N 프레임마다 1장 처리
  scale: 1.0            # 축소 배율. 1.0 미만이면 카메라가 멀어진 상황을 흉내낸다(실험용)
  scale_mode: shrink    # shrink=화면 크기 유지하고 내용만 축소 / resize=프레임 자체 축소

detector:
  name: yolo
  model_path: yolov8n.pt   # 사전학습 가중치. 1차 구현에서는 재학습하지 않는다
  device: cpu              # Intel Arc 환경이므로 CUDA 대신 cpu
  # 작은 사람이 많으면 키운다. 텐서 속 사람 키 90px 이상이 목표. (docs/scale-limits.md)
  # 실측(사람 51px): 640 -> 재현율 42%, 960 -> 88%, 1280 -> 95%. 속도는 12.7 -> 7.3 -> 5.4 FPS.
  imgsz: 640
  conf_threshold: 0.25
  iou_threshold: 0.45
  classes: [person]        # 1차 구현 범위: 사람만
  half: false

tracker:
  # bytetrack: 움직임(칼만)+IoU 만 사용. 빠르지만 '분열'과 '뒤바뀜' 모두 해결 못 함.
  #            개발 중 빠른 반복이 필요할 때 --tracker bytetrack 으로 쓴다.
  # botsort  : 외형(ReID) 추가. 두 실패 모두 해결. 약 30% 느리다. (기본값)
  #            동일 조건 실측 2회: bytetrack 8.3 FPS vs botsort 5.9 FPS
  # 근거: docs/tracker-comparison.md, docs/phase3-failure-notes.md
  name: botsort
  track_activation_threshold: 0.25   # 이 점수 이상이면 새 track 후보
  # 사라진 track 을 몇 프레임 동안 기억할지. 재등장 공백보다 커야 재식별이 가능하다.
  # 실측: 공백 50 처리프레임을 넘기려면 90 이 필요했다(기본 30 으로는 실패).
  lost_track_buffer: 90
  # 주의: IoU 값이 아니라 'IoU 거리(1-IoU)'의 상한이다. 값이 클수록 관대하다.
  # 실측(store-aisle): 0.8/0.9/0.95 -> track 5개, 0.5 -> 11개, 0.3 -> 31개
  minimum_matching_threshold: 0.8
  frame_rate: 30
  minimum_consecutive_frames: 1      # 몇 프레임 연속 매칭돼야 track 확정인지

  # 아래는 name: botsort 일 때만 사용된다 (ByteTrack 은 무시)
  reid:
    weights: osnet_x0_25_msmt17.pt   # 경량 ReID 백본. 없으면 자동 다운로드
    device: cpu
    half: false
    # 주의: 외형 비교는 IoU 게이트를 통과한 쌍에만 적용된다.
    #   proximity_threshold 보다 IoU 거리가 크면 외형 정보가 버려진다(boxmot botsort.py:289-296).
    #   가림 후 재식별을 노린다면 1.0 으로 게이트를 열어야 한다.
    #   boxmot 기본값은 0.5 / 0.25 이며, 이 값은 '교차'만 해결하고 '재등장'은 해결하지 못한다.
    #   아래는 두 실험(store-aisle 재등장 + people-detection 교차)에서 모두 통과한 값이다.
    proximity_threshold: 1.0         # 1.0 = IoU 게이트 없음
    appearance_threshold: 0.5        # 외형 거리 상한. 클수록 관대
    # 주의: 재등장 재식별에는 lost_track_buffer 도 함께 키워야 한다(공백 길이 이상).
    #   위 실험에서는 lost_track_buffer: 90 이 필요했다. 셋 중 하나만 빠져도 실패한다.
    # 미검증 위험: 혼잡하고 옷차림이 비슷한 장면에서의 오병합(false merge).

# 구역 정의 — 좌표는 카메라 설치 위치에 종속이므로 별도 파일에 둔다
# 새로 정할 때: python scripts/export_frame.py <영상> --frame <번호>
zones:
  enabled: true
  path: zones.yaml

# 계층 2 · 매장 단위 신원 레지스트리
# tracker 는 초 단위 짧은 공백만 메운다. 고객이 매장을 나갈 때까지 추적하려면 이 계층이 필요하다.
# 근거: docs/tracker-comparison.md (버퍼를 30->150 으로 키워도 재식별은 복구되지 않았다)
identity:
  enabled: true
  # 새 track 을 사진 한 장으로 즉시 판정할 때의 기준. 천장 시점에서는 이 판정이 자주 틀린다
  # (같은 사람을 57% 만 이어줌) — 아래 '나중에 합치기'가 뒤에서 바로잡는다.
  match_threshold: 0.65
  max_templates: 5           # 한 사람당 외형 템플릿 수. 크기·자세 변화를 견디려면 여러 개가 필요
  # 몇 초마다 사진을 한 장 더 모을지. 같은 5초라도 0.5초 간격 10장이 1초 간격 5장보다
  # 같은 사람을 잘 잇는다 (88% vs 80%, scripts/identity_calibration.py)
  template_refresh_seconds: 0.5
  # 이 시간 동안 '연속으로' 안 보이면 매장을 나간 것으로 본다. 체류 시간 상한이 아니다.
  # 보일 때마다 시계가 초기화되므로 계속 보이는 고객은 몇 분이든 유지된다.
  # 단위가 초인 이유: 프레임 번호는 원본 fps 와 stride 에 따라 뜻하는 시간이 달라진다.
  # 실제로 900프레임을 30초로 알고 썼으나 59.9fps 영상에서는 15초였다.
  # 실제 운영에서는 EXIT 존 이벤트로 대체해야 한다.
  retire_after_seconds: 30.0
  min_tensor_height: 65      # 이보다 작은 관측은 신원 판단에 쓰지 않는다 (docs/scale-limits.md)
  # 위치·시간 근거: 방금 근처에서 사라진 사람이 곧 다시 나타나면 생김새 기준을 완화한다.
  # 선반 뒤에 잠깐 가려지는 경우를 위한 것이다. 화면 밖으로 나갔다 돌아오는 경우에는
  # 가장자리가 모든 손님의 출입구라 위치가 근거가 되지 못하므로, 창을 짧게 둔다.
  stitch_enabled: true
  stitch_max_seconds: 3.0
  stitch_max_distance: 1.0   # 체구 높이 배수
  stitch_threshold: 0.45
  # 나중에 합치기: 새로 등록된 신원이 사진을 충분히 모으면(10장 = 약 5초), 그 직전에 사라진
  # 사람과 '평균끼리' 다시 비교해 같으면 합친다. 판정을 보류하지 않으므로 행동을 놓치지 않는다.
  # 두 사람이 같은 시각에 함께 보인 적이 있으면 절대 합치지 않는다.
  # MERL train 실측 (다른 사람 오병합 5% 로 묶었을 때 같은 사람을 이어주는 비율):
  #   즉시, 사진 1장         57%
  #   연속 8장 (0.5초)       67%   <- 판정 보류 방식. 보류 비용에 비해 이득이 작아 쓰지 않는다
  #   0.5초 간격 10장 (5초)  88%   <- 이 방식
  late_merge_enabled: true
  # 화면 가장자리에 걸려 몸이 잘린 사진으로는 즉시 판정하지 않고 새 신원으로 둔다 (나중에 합치기가 판단).
  # 막 들어오는 순간엔 머리카락만 보여 누구든 닮아 보인다 — people-detection 에서 다른 사람들을 합쳤다.
  edge_margin: 0.02
  late_merge_samples: [10, 20, 40]
  late_merge_threshold: 0.875

# 계층 3 · TAKE 후보 판정
# '선반에 가까움'만으로는 못 거른다 — 전체 영상에서 모두가 선반에 30~90% 접촉했다(docs/zones.md).
# 통로를 걷는 것 자체가 선반 옆에 있는 것이므로, 근접에 '멈춤'을 더한다.
interaction:
  enabled: true
  # 라벨 기준 스윕 결과 0.15 -> 0.05 로 낮추는 것이 F1 0.57 -> 0.70 으로 가장 큰 개선이었다.
  # (낮추면 구간이 덜 끊겨 실제 집는 순간을 포함할 확률이 올라간다)
  min_overlap: 0.05
  # 단위는 픽셀이 아니라 '체구 높이 / 초'. 사람 크기가 한 화면에서 4~10배 변하므로
  # 픽셀 기준이면 멀리 있는 사람의 정상 보행이 전부 '멈춤'으로 오인된다.
  # 정답 라벨(TAKE 19 / BROWSE 14)로 스윕해 정한 값. F1 0.57 지점.
  # 주의: 속도 조건의 기여는 크지 않다. 완전히 끄면 F1 0.54 로 0.03 밖에 안 떨어진다.
  #       대부분의 판별력은 dwell_seconds 에서 나온다.
  # 정정 기록: 라벨 없이 속도 분포만 보고 0.05 로 잡았었는데, 라벨로 재보니 더 나빴다
  #          (F1 0.52). 집는 동작에는 실제로 움직임이 있어 과하게 조이면 재현율이 떨어진다.
  max_speed: 0.30
  dwell_seconds: 3.0         # 접촉+저속이 이 시간 이상 이어져야 후보
  gap_tolerance_seconds: 0.5
  speed_window_seconds: 0.4

# 손님 상태 · 결제 · 출구 판정 (docs/risk-pipeline.md)
# 집기 행동이 있는데 결제가 전혀 없이 출구에 들어서면 HIGH_RISK,
# 결제가 집기 행동보다 적으면 REVIEW(관리자 확인), 그 외 CLEAR.
risk:
  enabled: true
  payments: null             # 결제 기록 CSV. 명령행 --payments 로도 지정
  exit_min_seconds: 0.5      # 출구 구역에 이만큼 연속으로 있어야 '들어섰다'고 본다 (스쳐 지나가기 제외)
  # 경보 두 단계: 출구에 다가서면 WARNING, 출구 구역에서 사라진 뒤 이만큼 다시 안 나타나면 최종 판정.
  # 한 번의 출구 사건으로 HIGH_RISK 를 확정하면 혼잡한 문 앞에서 오경보가 났다(Shoplifting047).
  exit_confirm_seconds: 3.0
  # 최종 HIGH_RISK 직전 신원 확인: 최근 1.5초 모습이 이전 모습과 이보다 덜 닮으면 뒤바뀜 의심 -> REVIEW.
  # MERL 실측: 같은 사람 오인 5.6% / 실제 뒤바뀜 82% 잡음
  swap_threshold: 0.78
  swap_window_seconds: 5.0   # 매장 안 마지막 5초 중 최고값으로 판단 (문 쪽 역광으로 잠깐 떨어지는 것은 무시)
  exit_rearm_seconds: 2.0    # 출구를 이만큼 벗어나야 다음 방문으로 본다 (경계에서 들락날락 방지)
  checkout_grace_seconds: 3.0  # 결제 순간 계산대를 막 떠난 손님도 결제자로 본다

# 관리자 앱·대시보드 경보 서버로 위험 판정 보내기 (서버·전송 모듈: experiments/app-pos, 담당 한호석)
# server 를 비우면 환경변수 HAWKEYE_SERVER, 그것도 없으면 보내지 않는다. API 키는 환경변수 HAWKEYE_API_KEY 로만.
alerts:
  server: null
  camera_id: cam1
  client_path: ../app-pos/client
  snapshot_seconds: 6.0      # '출구 쪽에서 사라짐' 경보는 사라지고 3초 뒤 확정 -> 그 전 장면을 찾으려면 더 길게
  snapshot_max_side: 960

# 선반 지도 — 지켜보는 선반에서 물건이 몇 개 줄었는지 세어 손님 기록에 붙인다 (docs/shelf-map.md)
# areas 가 비어 있으면 꺼진다. 영역은 카메라마다 다르므로 보통 명령줄 --shelf 로 준다.
shelves:
  areas: []                  # 예: [{name: shelf1, box: [0.35, 0.62, 0.80, 0.95], zone: shelf_left}]
  model_path: yolov8n.pt     # 물건 탐지 (지금은 일반 YOLO, 2단계에서 상품 모델)
  imgsz: 1280                # 작은 물건용. 사람 탐지는 detector.imgsz 로 따로
  conf: 0.15
  stable_seconds: 0.6

output:
  dir: outputs
  write_video: true
  video_name: tracked.mp4
  write_observations: true
  observations_name: observations.jsonl
  write_identities: true
  identities_name: identities.jsonl
  write_takes: true
  takes_name: take_candidates.jsonl
  show_window: false
  draw_zones: true
  draw_trail: true
  trail_length: 30
