# 구역 정의 (좁은 면 버전) — store-aisle-detection.mp4
#
# zones.yaml 은 선반 '전체'를 덮어서, 통로를 걷기만 해도 겹침이 크게 잡혔다.
# 그 결과 TAKE 후보가 24초짜리 덩어리로 나왔다(docs/take-candidates.md §6-B).
#
# 여기서는 **통로를 향한 선반 면**만 좁은 띠로 잡는다.
# 손이 닿는 위치에 몸이 있어야만 겹치도록 하는 것이 목적이었다.
#
# === 실험 결과: 효과 없음 ===
# 정답 라벨로 zones.yaml 과 동일 격자에서 비교한 결과, 모든 설정에서 **수치가 완전히 동일**했다.
#   겹침 0.15/0.10/0.08/0.05/0.03 x 체류 2.0/3.0  -> F1, 정밀도, 재현율 전부 일치
# 이유: 통로가 좁아 선반 옆을 걷는 것과 선반 앞에 서는 것이 기하적으로 구분되지 않는다.
# 이 파일은 같은 실험을 반복하지 않기 위한 기록으로 남긴다. 기본값은 zones.yaml 이다.

normalized: true

zones:
  # 왼쪽 선반의 통로쪽 면
  - name: shelf_left_face
    type: SHELF
    polygon: [[0.13, 0.00], [0.21, 0.00], [0.19, 1.00], [0.11, 1.00]]

  # 오른쪽 선반의 통로쪽 면 (원근 때문에 아래로 갈수록 오른쪽으로)
  - name: shelf_right_face
    type: SHELF
    polygon: [[0.60, 0.00], [0.70, 0.00], [0.86, 1.00], [0.74, 1.00]]

  # 가운데 진열대 — 왼쪽 통로를 향한 면
  - name: display_left_face
    type: SHELF
    polygon: [[0.27, 0.28], [0.33, 0.28], [0.22, 1.00], [0.12, 1.00]]

  # 가운데 진열대 — 오른쪽 통로를 향한 면
  - name: display_right_face
    type: SHELF
    polygon: [[0.49, 0.28], [0.55, 0.28], [0.62, 1.00], [0.54, 1.00]]

  - name: exit_far
    type: EXIT
    polygon: [[0.30, 0.00], [0.56, 0.00], [0.56, 0.11], [0.30, 0.11]]
