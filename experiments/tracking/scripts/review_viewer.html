<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오판 장면 보기</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --soft: #efeee9;
  --accent: #2f6fdb; --ok: #1f8a4c; --bad: #c8382e; --warn: #c27c0e; --exp: #7a4fc9;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9c9b95; --line: #34332f; --soft: #2a2926;
          --accent: #6b9cf0; --ok: #4cc27f; --bad: #f0675c; --warn: #e9a63a; --exp: #a98af0; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; }
aside header { padding: 16px 16px 8px; position: sticky; top: 0; background: var(--panel); z-index: 2; border-bottom: 1px solid var(--line); }
aside h1 { font-size: 17px; margin: 0 0 4px; }
aside .sub { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; margin-top: 10px; }
.tabs button { flex: 1; border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 5px 0; cursor: pointer; font-size: 13px; }
.tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.group { padding: 10px 12px 2px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.case { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 14px 8px 12px; cursor: pointer; border-left: 3px solid transparent; }
.case:hover { background: var(--soft); }
.case.on { background: var(--soft); border-left-color: var(--accent); }
.case .t { font-weight: 600; font-size: 13px; }
.case .m { color: var(--muted); font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; margin-right: 4px; font-weight: 600; vertical-align: 1px; }
.b-fixed { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.b-open { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.b-exp { background: color-mix(in srgb, var(--exp) 18%, transparent); color: var(--exp); }
.b-info { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pairgrid { padding: 8px 12px; }
.pairgrid table { border-collapse: collapse; width: 100%; font-size: 12px; }
.pairgrid th, .pairgrid td { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: center; }
.pairgrid th { color: var(--muted); font-weight: 500; font-size: 11px; }
.pairgrid td:first-child { text-align: left; font-family: var(--mono); }
.pairgrid tr { cursor: pointer; }
.pairgrid tr:hover td { background: var(--soft); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
main { overflow: auto; padding: 16px 20px 40px; }
.casehead h2 { margin: 0 0 6px; font-size: 19px; }
.casehead .desc { max-width: 980px; }
.casehead .desc p { margin: 6px 0; }
.look { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.look button { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.look button:hover { border-color: var(--accent); color: var(--accent); }
.look button b { font-family: var(--mono); font-weight: 600; margin-right: 4px; }
.runs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 10px; align-items: stretch; }
.runbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; min-width: 170px; }
.runbtn.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.runbtn .n { font-weight: 600; font-size: 13px; }
.runbtn .r { font-size: 12px; color: var(--muted); }
.runbtn .ok { color: var(--ok); font-weight: 600; } .runbtn .bad { color: var(--bad); font-weight: 600; }
.more { align-self: center; }
.more select { font: inherit; padding: 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.videos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.videos.big1 { grid-template-columns: 1fr; } .videos.big1 .cam[data-cam=angle0] { display: none; }
.videos.big0 { grid-template-columns: 1fr; } .videos.big0 .cam[data-cam=angle1] { display: none; }
.videos.big1 .cam, .videos.big0 .cam { width: 100%; max-width: calc(70vh * 16 / 9); margin: 0 auto; }
.cam { background: #000; border-radius: 8px; overflow: hidden; position: relative; }
.cam .stage { position: relative; aspect-ratio: 16/9; }
.cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cam .label { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 12px; background: rgba(0,0,0,.55); padding: 1px 7px; border-radius: 4px; z-index: 3; }
.cam .zoom { position: absolute; right: 6px; top: 6px; z-index: 3; background: rgba(0,0,0,.55); color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-size: 12px; padding: 1px 7px; }
.cam .note { position: absolute; left: 0; right: 0; bottom: 0; color: #fff; font-size: 12px; background: rgba(0,0,0,.6); padding: 2px 8px; z-index: 3; display: none; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 6px; }
.transport button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.transport button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); min-width: 64px; }
.transport .time { font-family: var(--mono); font-size: 13px; margin-left: 4px; min-width: 120px; }
.transport label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; cursor: pointer; }
.transport select { font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); padding: 2px; }
.timeline { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 8px 96px; user-select: none; }
.lane { position: relative; height: 18px; margin: 3px 0; }
.lane .name { position: absolute; left: -90px; width: 84px; font-size: 11px; color: var(--muted); text-align: right; top: 1px; white-space: nowrap; }
.lane .bg { position: absolute; inset: 7px 0; background: var(--soft); border-radius: 2px; }
.mk { position: absolute; top: 2px; height: 14px; min-width: 4px; border-radius: 3px; cursor: pointer; opacity: .9; }
.mk:hover { outline: 2px solid var(--ink); z-index: 2; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; z-index: 3; }
.scrub { position: absolute; left: 96px; right: 8px; top: 0; bottom: 0; cursor: crosshair; }
.tip { position: fixed; z-index: 50; background: var(--ink); color: var(--panel); font-size: 12px; padding: 5px 8px; border-radius: 6px; max-width: 420px; pointer-events: none; display: none; white-space: pre-line; }
.lower { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1.3fr); gap: 12px; margin-top: 12px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.box h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.people { width: 100%; border-collapse: collapse; font-size: 13px; }
.people td, .people th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.people th { color: var(--muted); font-weight: 500; font-size: 12px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.log { max-height: 340px; overflow: auto; font-size: 13px; }
.log div { padding: 3px 4px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 54px 66px 1fr; gap: 6px; }
.log div:hover { background: var(--soft); }
.log div.near { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.log .tm { font-family: var(--mono); color: var(--muted); }
.log .k { font-size: 12px; font-weight: 600; }
.legend { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.8; }
.legend span { margin-right: 12px; white-space: nowrap; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
code { font-family: var(--mono); font-size: 12px; background: var(--soft); padding: 0 4px; border-radius: 3px; }
@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .videos, .lower { grid-template-columns: 1fr; }
  main { padding: 12px 16px 40px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>오판 장면 보기</h1>
      <div class="sub">store01 카메라 2대 · 기록을 다시 판정한 결과를 원본 영상 위에 그림</div>
      <div class="tabs"><button id="tabCases" class="on">문제 목록</button><button id="tabPairs">모든 영상</button></div>
    </header>
    <div id="caseList"></div>
    <div id="pairList" class="pairgrid" hidden></div>
  </aside>
  <main id="main"><div class="empty">불러오는 중…</div></main>
</div>
<div class="tip" id="tip"></div>
<script>
// ------------------------------------------------------------------ 데이터 불러오기
const HE = { _index: null, _cases: [], _data: {}, _wait: {} };
HE.index = d => { HE._index = d; };
HE.cases = c => { HE._cases = c; };
HE.loaded = (key, d) => { HE._data[key] = d; (HE._wait[key] || []).forEach(f => f(d)); delete HE._wait[key]; };
function loadScript(src) {
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(src); document.head.appendChild(s); });
}
function loadPair(run, pair) {
  const key = run + '/' + pair;
  if (HE._data[key]) return Promise.resolve(HE._data[key]);
  return new Promise((ok, no) => {
    (HE._wait[key] = HE._wait[key] || []).push(ok);
    loadScript(`data/${run}/${encodeURIComponent(pair)}.js`).catch(() => no(new Error('기록 없음: ' + key)));
  });
}

// ------------------------------------------------------------------ 공통
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = ms => (ms / 1000).toFixed(1) + '초';
const PALETTE = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4', '#469990',
  '#dcbeff', '#9a6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075'];
const colorOf = pid => pid > 0 ? PALETTE[(pid - 1) % PALETTE.length] : '#9a9a9a';
const LEVEL = { HIGH_RISK: ['경보', 'var(--bad)'], CLEAR: ['통과', 'var(--ok)'], REVIEW: ['확인 필요', 'var(--warn)'], WARNING: ['출구 접근', 'var(--muted)'] };
const runName = k => (HE._index.runs.find(r => r.key === k) || { name: k }).name;

const state = { mode: 'case', caseId: null, pair: null, run: null, runs: [], data: null, playing: false, t: 0, big: '' ,
  show: { boxes: true, kp: true, zones: true, edge: true, items: false } };

// ------------------------------------------------------------------ 왼쪽 목록
function verdictOk(s, pair) {
  if (!s) return null;
  const theft = pair[0] === 'T';
  return theft ? s.verdicts.includes('HIGH_RISK') : !s.verdicts.includes('HIGH_RISK');
}
function renderSide() {
  const groups = {};
  HE._cases.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
  const B = { fixed: ['b-fixed', '해결'], open: ['b-open', '남음'], exp: ['b-exp', '실험'], info: ['b-info', '참고'] };
  $('#caseList').innerHTML = Object.entries(groups).map(([g, cs]) => `<div class="group">${esc(g)}</div>` + cs.map(c =>
    `<button class="case" data-id="${c.id}"><div class="t"><span class="badge ${B[c.status][0]}">${B[c.status][1]}</span>${esc(c.title)}</div>
     <div class="m">${esc(c.pair)} · ${esc(c.short || '')}</div></button>`).join('')).join('');
  document.querySelectorAll('.case').forEach(b => b.onclick = () => openCase(b.dataset.id));
  const runs = HE._index.runs.filter(r => HE._index.summary[r.key]);
  const truth = HE._index.truth;
  $('#pairList').innerHTML = `<table><tr><th>쌍</th>${runs.map(r => `<th title="${esc(r.name)}">${esc(r.key)}</th>`).join('')}</tr>` +
    HE._index.pairs.map(p => `<tr data-p="${p}"><td>${p}</td>${runs.map(r => {
      const s = HE._index.summary[r.key][p];
      if (!s) return '<td></td>';
      const ok = verdictOk(s, p), ppl = truth[p] && s.people === truth[p].people;
      return `<td title="${esc(r.name)}: ${esc(s.verdicts.join(',') || '판정 없음')} / 손님 ${s.people}"><span class="dot" style="background:${ok ? 'var(--ok)' : 'var(--bad)'}"></span>${ppl ? '' : '<sup style="color:var(--warn)">수</sup>'}</td>`;
    }).join('')}</tr>`).join('') + `</table><div class="legend"><span><span class="dot" style="background:var(--ok)"></span> 판정 맞음</span><span><span class="dot" style="background:var(--bad)"></span> 틀림</span><span><sup style="color:var(--warn)">수</sup> 손님 수 틀림</span></div>`;
  document.querySelectorAll('#pairList tr[data-p]').forEach(tr => tr.onclick = () => openPair(tr.dataset.p));
}
$('#tabCases').onclick = () => { $('#tabCases').classList.add('on'); $('#tabPairs').classList.remove('on'); $('#caseList').hidden = false; $('#pairList').hidden = true; };
$('#tabPairs').onclick = () => { $('#tabPairs').classList.add('on'); $('#tabCases').classList.remove('on'); $('#caseList').hidden = true; $('#pairList').hidden = false; };

// ------------------------------------------------------------------ 본문
function openCase(id) {
  const c = HE._cases.find(x => x.id === id);
  state.mode = 'case'; state.caseId = id; state.pair = c.pair;
  state.runs = c.runs; location.hash = 'case=' + id;
  document.querySelectorAll('.case').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  buildMain(c);
  switchRun(c.run || c.runs[0], c.look && c.look[0] ? c.look[0].t * 1000 : 0);
}
function openPair(p) {
  state.mode = 'pair'; state.caseId = null; state.pair = p;
  state.runs = HE._index.runs.filter(r => HE._index.summary[r.key] && HE._index.summary[r.key][p]).map(r => r.key);
  location.hash = 'pair=' + p;
  document.querySelectorAll('.case').forEach(b => b.classList.remove('on'));
  const t = HE._index.truth[p] || {};
  buildMain({ title: `${p} — ${t.expected || ''} · 손님 ${t.people ?? '?'}명`, pair: p, desc: `<p>${esc(t.notes || '')}</p>`, look: [] });
  switchRun(state.runs.includes('ankle') ? 'ankle' : state.runs.includes('edgegap') ? 'edgegap' : state.runs[0], 0);
}

function buildMain(c) {
  const m = $('#main');
  const look = (c.look || []).map((l, i) => `<button data-i="${i}"><b>${l.t.toFixed(1)}초</b>${esc(l.label)}${l.run ? ` <span style="color:var(--muted)">· ${esc(runName(l.run))}</span>` : ''}</button>`).join('');
  m.innerHTML = `
  <div class="casehead"><h2>${esc(c.title)}</h2><div class="desc">${c.desc || ''}</div>
    ${look ? `<div class="look">${look}</div>` : ''}</div>
  <div class="runs" id="runs"></div>
  <div class="videos" id="videos">
    <div class="cam" data-cam="angle1"><div class="stage"><video id="v1" muted playsinline preload="auto"></video><canvas id="c1"></canvas></div>
      <div class="label">전체 카메라 (angle1)</div><button class="zoom" data-z="1">크게</button><div class="note" id="n1"></div></div>
    <div class="cam" data-cam="angle0"><div class="stage"><video id="v0" muted playsinline preload="auto"></video><canvas id="c0"></canvas></div>
      <div class="label">선반 카메라 (angle0)</div><button class="zoom" data-z="0">크게</button><div class="note" id="n0"></div></div>
  </div>
  <div class="transport">
    <button class="primary" id="play">재생</button>
    <button id="back1" title="1초 뒤로 (←)">−1초</button><button id="prev" title="한 장 뒤로 (,)">◀ 한 장</button>
    <button id="next" title="한 장 앞으로 (.)">한 장 ▶</button><button id="fwd1" title="1초 앞으로 (→)">+1초</button>
    <select id="rate"><option value="0.25">0.25배</option><option value="0.5" selected>0.5배</option><option value="1">1배</option><option value="2">2배</option></select>
    <span class="time" id="time">0.0초</span>
    <label><input type="checkbox" data-s="boxes" checked>상자·번호</label>
    <label><input type="checkbox" data-s="kp" checked>관절(팔)</label>
    <label><input type="checkbox" data-s="zones" checked>구역</label>
    <label><input type="checkbox" data-s="edge" checked>가장자리 닿음</label>
    <label><input type="checkbox" data-s="items">선반 물건 탐지</label>
  </div>
  <div class="timeline" id="timeline"></div>
  <div class="legend">
    <span>상자 색 = 전체 카메라 최종 신원 (선반 카메라 상자는 그 순간 짝인 전체 카메라 신원의 색, 짝 없으면 흰색)</span><span>라벨 <code>3</code> = 신원, <code>5→3</code> = 나중에 합쳐짐, <code>#7</code> = 추적 번호</span>
    <span>회색 점선 = 신원 보류(-1)</span><span><b style="color:#ff9f1a">주황 굵은 변</b> = 화면 가장자리에 닿음(가장자리 규칙)</span>
    <span>빨간 손목 = 선반 영역 안</span><span>이름표의 <code>집음1·결제0</code> = 그 시각까지 확정된 것, 판정(경보·통과)은 판정 시각부터 표시 — 경보 손님은 빨간 이름표</span>
  </div>
  <div class="lower">
    <div class="box"><h3>지금 장면의 사람</h3><div id="people"></div></div>
    <div class="box"><h3>기록 (누르면 그 시각으로)</h3><div class="log" id="log"></div></div>
  </div>`;
  m.querySelectorAll('.look button').forEach(b => b.onclick = () => {
    const l = c.look[+b.dataset.i];
    if (l.run && l.run !== state.run) switchRun(l.run, l.t * 1000); else seek(l.t * 1000);
  });
  m.querySelectorAll('.zoom').forEach(b => b.onclick = () => {
    const z = 'big' + b.dataset.z; state.big = state.big === z ? '' : z;
    $('#videos').className = 'videos ' + state.big;
    m.querySelectorAll('.zoom').forEach(x => x.textContent = state.big ? '나란히' : '크게');
    draw();
  });
  m.querySelectorAll('input[data-s]').forEach(i => i.onchange = () => { state.show[i.dataset.s] = i.checked; draw(); });
  $('#play').onclick = togglePlay;
  $('#back1').onclick = () => seek(state.t - 1000); $('#fwd1').onclick = () => seek(state.t + 1000);
  $('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
  $('#rate').onchange = e => { $('#v1').playbackRate = $('#v0').playbackRate = +e.target.value; };
  const v1 = $('#v1'), v0 = $('#v0');
  v1.addEventListener('loadedmetadata', () => { v1.playbackRate = +$('#rate').value; seek(state.t); });
  v0.addEventListener('loadedmetadata', () => { v0.playbackRate = +$('#rate').value; syncDetail(true); });
  v1.addEventListener('seeked', draw); v0.addEventListener('seeked', draw);
  v1.addEventListener('ended', () => { state.playing = false; $('#play').textContent = '재생'; v0.pause(); });
  window.scrollTo(0, 0);
}

function renderRuns() {
  const p = state.pair, truth = HE._index.truth[p] || {};
  const html = state.runs.map(k => {
    const s = (HE._index.summary[k] || {})[p];
    if (!s) return '';
    const ok = verdictOk(s, p), pplOk = s.people === truth.people;
    const v = s.verdicts.length ? s.verdicts.map(x => (LEVEL[x] || [x])[0]).join('·') : '판정 없음';
    return `<button class="runbtn ${k === state.run ? 'on' : ''}" data-k="${k}"><div class="n">${esc(runName(k))}</div>
      <div class="r"><span class="${ok ? 'ok' : 'bad'}">${ok ? '맞음' : '틀림'}</span> · ${esc(v)} · 손님 <span class="${pplOk ? 'ok' : 'bad'}">${s.people}</span>/${truth.people ?? '?'}</div></button>`;
  }).join('');

  d.payments.forEach(p => rows.push([p.ms, '결제', `${p.items}개 → 손님 ${p.pid ?? '없음'}`, 'var(--accent)']));
  d.births.angle1.forEach(b => rows.push([b.ms, '새 신원', `전체 카메라 신원 ${b.pid} (추적 #${b.track})${b.edge ? ' — 가장자리 ' + edgeWord(b.edge) + '라 즉시 대조 안 함' : ''}`, 'var(--muted)']));
  d.revivals.angle1.forEach(r => rows.push([r.ms, '되살아남', `추적 #${r.track} ${(r.gap_ms / 1000).toFixed(1)}초 끊겼다 다시: 신원 ${r.before_pid} → ${r.after_pid}`, 'var(--muted)']));
  d.merges.angle1.forEach(m => rows.push([m.ms, '합침', `신원 ${m.from} → ${m.into}`, 'var(--muted)']));
  rows.sort((a, b) => a[0] - b[0]);
  state.logRows = rows;
  $('#log').innerHTML = rows.map(([ms, k, txt, c], i) => `<div data-i="${i}"><span class="tm">${(ms / 1000).toFixed(1)}</span><span class="k" style="color:${c}">${esc(k)}</span><span>${esc(txt)}</span></div>`).join('') || '<div>기록 없음</div>';
  $('#log').querySelectorAll('div[data-i]').forEach(r => r.onclick = () => seek(rows[+r.dataset.i][0]));
}
function markLog(t) {
  const rows = state.logRows || [];
  $('#log').querySelectorAll('div[data-i]').forEach(r => r.classList.toggle('near', Math.abs(rows[+r.dataset.i][0] - t) < 800));
}
function renderPeople(t) {
  const d = state.data, out = [];
  for (const cam of ['angle1', 'angle0']) {
    const { rows } = frameAt(cam, t), links = cam === 'angle0' ? linkNow(t) : {};
    for (const r of rows) {
      const [pid, rpid, tid, , , , , flags, sim] = r;
      let info = '';
      if (cam === 'angle1') {
        const cu = d.customers[rpid], lv = pid > 0 ? liveOf(rpid, t) : null;
        info = cu ? (cu.inside ? '손님' : '손님 아님(매장 안 1초 못 채움)') : '';
        if (lv) {
          info += ` · 지금까지 집음 ${lv.taken} · 결제 ${lv.paid}`;
          if (lv.verdict) info += ` · 판정 <b style="color:${LEVEL[lv.verdict.level][1]}">${LEVEL[lv.verdict.level][0]}</b>`;
          else if (lv.later) info += ` <span style="color:var(--muted)">(나중에 ${(lv.later.ms / 1000).toFixed(1)}초 ${LEVEL[lv.later.level][0]})</span>`;
        }
      } else if (links[rpid] !== undefined) info = `짝: 전체 카메라 ${links[rpid]}`;
      else info = '짝 없음';
      const sm = sim != null ? ` · 대조 ${sim}` : '';
      const swc = cam === 'angle1' ? colorOf(rpid) : (links[rpid] !== undefined ? colorOf(links[rpid]) : '#ffffff');
      out.push(`<tr><td>${cam === 'angle1' ? '전체' : '선반'}</td><td><span class="sw" style="background:${swc};outline:1px solid var(--line)"></span>${pid <= 0 ? '보류' : pid === rpid ? pid : pid + '→' + rpid}</td><td>#${tid}</td><td>${info}${sm}${flags & 1 ? ' · 새' : ''}${flags & 2 ? ' · 이어 붙임' : ''}</td></tr>`);
    }
  }
  $('#people').innerHTML = out.length ? `<table class="people"><tr><th>카메라</th><th>신원</th><th>추적</th><th>상태</th></tr>${out.join('')}</table>` : '<div style="color:var(--muted)">이 장면에 잡힌 사람 없음</div>';
}
window.addEventListener('resize', () => draw());

// ------------------------------------------------------------------ 시작
function route() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('pair')) { if (state.mode !== 'pair' || state.pair !== h.get('pair')) openPair(h.get('pair')); }
  else {
    const id = h.get('case') && HE._cases.some(c => c.id === h.get('case')) ? h.get('case') : HE._cases[0].id;
    if (state.mode !== 'case' || state.caseId !== id) openCase(id);
  }
}
window.addEventListener('hashchange', route);
Promise.all([loadScript('data/index.js'), loadScript('cases.js')]).then(() => { renderSide(); route(); }).catch(e => { $('#main').innerHTML = `<div class="empty">데이터를 못 불러옴 (${esc(e)}). <code>python scripts/review_export.py</code> 를 먼저 돌리세요.</div>`; });
</script>
</body>
