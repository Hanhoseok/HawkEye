note: |-
  4차 촬영(2026-11-19) 선반 카메라(angle0) 구역 — 초안 (2026-11-21, area_setting 장면을 눈으로 보고 그림, 사람 확인 전).
  화면 비율, **area_setting 장면 기준**. 영상마다 카메라 움직임만큼 옮겨 쓴다
  (outputs/sync_floor_shoot4/register.csv 의 영상→area_setting 호모그래피 역, scripts/shoot3_zones.py --shoot 4 check 로 확인).
  레인 이름은 센서 레인과 같다 (L1 칸타타 · L2 동과루 · L3 애플사이다). 받침의 왼쪽 칸들(L4 생수 · L5)은 센서를 못 믿어 구역 없음.
  받침이 비스듬히 보여 레인은 뒤로 갈수록 왼쪽으로 기운 네모다.
notes:
  shelf: 센서 레인 받침(검은 칸막이) 전체. 사람 상자가 겹치면 '선반을 가림'.
  L1: 맨 오른쪽 칸 — 칸타타(빨간 뚜껑 병), 처음 2개.
  L2: 오른쪽 둘째 칸 — 동과루(흰 캔), 처음 3개.
  L3: 오른쪽 셋째 칸 — 애플사이다(노란 캔), 처음 2개.
