camera: angle1
note: '4차 촬영(2026-11-19) 전체 카메라(angle1) 바닥 지도와 구역 — **area_setting 장면 기준** (영상마다 register 호모그래피로 옮겨 씀, scripts/dual_eval.py --shoot 4).

  3차 바닥 좌표계 그대로다: 3차·4차 area_setting 의 바닥 타일 무늬를 맞춰(scripts/shoot4_setup.py floor, 인라이어 55/83) 3차 보정점 4개를 4차 화면으로 옮겼다. 바닥 cm 구역·띠 축은 zones/store01_shoot3/floor.yaml 과 같다 (같은 매장·같은 가구 자리). 4차 판정 결과를 보고 고치지
  않는다.'
