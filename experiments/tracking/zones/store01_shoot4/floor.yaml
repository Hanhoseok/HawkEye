camera: angle1
note: |-
  4차 촬영(2026-11-19) 전체 카메라(angle1) 바닥 지도와 구역 — 초안. **area_setting 장면 기준** (영상마다 register 호모그래피로 옮겨 씀,
  scripts/dual_eval.py --shoot 4). 바닥 좌표는 3차와 같은 틀이다: 흰 테이프 4장의 cm 를 3차 바닥 좌표로 옮겨 적었다
  (zones/store01_shoot4/floor_angle1.yaml 과 같은 보정, scripts/shoots.py). cm 는 실측이 아니다.
  바닥 x 는 화면 왼쪽으로 갈수록 커지고, 바닥 y 는 카메라 쪽(화면 아래)으로 갈수록 커진다.
notes:
  door: 3차 구역 그대로 (문은 화면 왼쪽 밖).
  counter: 3차 구역 그대로. 4차는 계산대에 노트북 · 휴대폰 거치대가 놓였다 — 결제 소리가 난 때의 발 자리로 확인할 것.
  shelf: 3차 구역 그대로 (레인 받침 앞 발).
  aisle: 3차 구역 그대로.
  band: 선반 앞 띠 축 = 바닥 y (-10 = 문 쪽 통로, 90 = 선반 앞 화면 아래 끝).
band:
