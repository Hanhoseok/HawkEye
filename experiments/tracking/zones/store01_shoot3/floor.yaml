camera: angle1
note: |-
  3차 촬영(2026-11-11) 전체 카메라(angle1) 바닥 지도와 구역 — 초안. **area_setting 장면 기준** (영상마다 register 호모그래피로 옮겨 씀,
  scripts/dual_eval.py --shoot 3). cm 는 실측이 아니다 (노란 메모지 4장을 64×74cm 로 가정, zones/store01_shoot3/floor_angle1.yaml 과 같은 보정).
  바닥 x 는 화면 왼쪽으로 갈수록 커지고, 바닥 y 는 카메라 쪽(화면 아래)으로 갈수록 커진다.
notes:
  door: '문은 화면 왼쪽 삼각대 옆(화면 밖). 39편 기록(영상 화면 → 영상별 보정 → 바닥 cm)의 입장·퇴장 발 자리. 2026-11-12 다시 그림 — 처음 초안은 area_setting
    장면 발 분포로 그려 계산대·선반 자리가 어긋났다 (계산대 결제 0, 13/39).'
  counter: 계산대 앞에 선 발 (N01 13~17s 발 ≈ (3, 34)cm 등, 39편 기록의 늦은 시간 밀집).
  shelf: 레인 받침 앞 발 (N01 7~9s ≈ (0..22, 73)cm, 화면 아래 끝에 발이 잘림 — 잘린 발은 상자 아래 = 바닥 y≈75).
  aisle: 매장 안 바닥. 위쪽(바닥 y < -25, x < 260)의 창가 가방·책상 자리 가짜 사람 상자와 (330, -130) 근처 고정 상자는 뺌.
  band: 선반 앞 띠 축 = 바닥 y (-10 = 문 쪽 통로, 90 = 선반 앞 화면 아래 끝). 계산대(~35)·선반(~65)이 이 축에 놓인다.
