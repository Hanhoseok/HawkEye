# 직접 찍은 무인매장 영상 (source/N01, N01-1) 기준 구역 — 1920x1080, 카메라 눈높이·수평.
# 정상 영상(N)의 사람 상자 위치를 재서 정했다. 절도 영상(T)은 이 파일을 보지 않고 transfer_zones.py 로 옮겨 쓴다.
#
# 이 각도에서는 사람 발이 화면에 안 나온다 — 상자 아래쪽이 늘 화면 끝(y 0.99)이다.
# 그래서 계산대·출구는 높이가 아니라 '좌우 위치'로 가른다 (정상 영상 실측 상자 가운데 x):
#   선반 앞 0.25~0.36 / 계산대 0.63~0.69 / 들어오고 나가는 곳 = 화면 오른쪽 끝 0.82 이상
# 선반 영역(--shelf): shelf1=0.02,0.70,0.45,0.88@shelf   (아래 단 — 병·작은 상자가 놓인 곳)
normalized: true
zones:
  - name: shelf
    type: SHELF
    polygon: [[0.00, 0.25], [0.45, 0.25], [0.45, 1.00], [0.00, 1.00]]
  - name: counter
    type: CHECKOUT
    polygon: [[0.55, 0.88], [0.78, 0.88], [0.78, 1.00], [0.55, 1.00]]
  - name: door_right
    type: EXIT
    polygon: [[0.80, 0.88], [1.00, 0.88], [1.00, 1.00], [0.80, 1.00]]
