note: |-
  2차 촬영(2026-10-28) 선반 카메라(angle0) 구역 — 선반 칸 = SHELF 구역 (설계 M-6·M-7). 화면 비율.
  구역 편집 페이지(scripts/zone_editor.html)로 고친다.
notes:
  shelf: 선반 전체 상자. 사람 상자가 이 상자와 겹치면 '선반을 가림' — 가림 전후 물건 탐지를 비교해 선반 방문 하나를 만든다.
  card: 가운데 단 왼쪽의 흰 삼각 포장 (일반 YOLO 가 못 잡음 — 1차의 '흰 카드'). 사람 없는 첫 장면(20261028_N1)에서 물건 자리를 보고 그림.
  bottle: 가운데 단의 생수병·캔 묶음 (YOLO bottle 0.43~0.79). 20261028_N1 첫 장면에서 그림.
  box: 아래 단 왼쪽 빵 상자. 20261028_N1 첫 장면에서 그림.
  band_map: '선반 카메라 사람 상자 가운데 x(화면 비율) → 선반 앞 띠 위치: band = a·x + b. 그린 값이 아니라 scripts/dual_eval.py calibrate 가 정상(N) 영상으로 맞춘다.'
