camera: angle1
note: |-
  바닥 지도와 구역 (2026-11-03). 구역 편집 페이지(scripts/zone_editor.html)로 고친다 — 고치면 notes 에 무엇을 왜 바꿨는지 남긴다.
  cm 는 실측이 아니다 (calibration 참고). 구역 판단·두 카메라 짝은 상대 위치만 써서 판단 영향은 작다.
notes:
  calibration: '추정값 (2026-11-03): 영상이 흐려(선명도 중앙값 13) 바닥 타일 줄눈이 거의 안 잡혀(허프 직선 11개, 대부분 선반 가장자리) 선반 아래 선과 찾은 줄눈 하나를 통로 폭 120cm·깊이 240cm 직사각형으로 가정했다. 실측이 생기면 scripts/calibrate_floor.py 로 바꾼다.'
  band: 선반 앞 띠 축 = 바닥 y(통로 방향) 0~169cm (선반 앞 + 계산대 앞). 두 카메라 사람 잇기의 공통 좌표 — 선반 카메라 x 를 angle0.yaml band_map 으로 이 축에 옮긴다. 바꾸면 dual_eval.py calibrate 로 band_map 을 다시 맞춘다.
  shelf: N01 손님이 선반 앞에 있던 3.5~7.5초의 발 위치(화면 x 695~900, y 880~917 px) 둘레 (2026-11-03).
  counter: N01 계산대 앞 9~14초의 발 위치(x 714~802, y 619~660 px). 계산대 상판이 아니라 계산대 앞에 선 사람의 발 자리 (2026-11-03).
  door: N01 나가는 14.5~17.5초의 발 위치. 처음엔 화면 위 가운데 유리창을 문으로 가정했다가 오른쪽 위로 바로잡음 (2026-11-03). 외투 의자 자리도 덮어 그 가짜 상자를 위치로 못 거름 (C-24).
  outside: 문 너머 (오른쪽 위). 매장 안에 있던 사람이 여기 보이면 나감 확정.
  aisle: '2026-11-03 추가: N01 입장 경로와 선반·계산대 사이 바닥, 문 앞(x>1460 px) 제외. 매장 안 판단(risk.inside_zones)용.'
  ignore_image: '사람 아님 영역 (화면 비율 x1, y1, x2, y2): 의자 위 외투, 오른쪽 아래 외투 (B-11, 2026-11-03). 처음의 오른쪽 세로 띠는 너무 넓어 실제 상자에 맞게 바꿈. 영역과 0.5 이상 겹치는 사람 상자만 버린다. 세 번째(오른쪽 전체 높이)는 전체 카메라 관절 모델(yolov8n-pose)이 외투 일대를
    잡는 큰 상자용 (B-11, 2026-11-09) — 이 상자와만 0.5 이상 겹치고, 그 앞을 지나는 손님 상자는 안 걸림(38쌍에서 매장 안 구역 발 0건).'
  shelf_image: '전체 카메라 화면의 나무 선반 영역 (화면 비율 다각형, 2026-11-04). 사람 없는 N01 첫 장면에서 그림: 선반 앞 모서리(나무와 바닥 경계) x≈0.375, 위쪽은 계산대 끝(흰 상자, y<0.33)을 뺌. 손목이 이 안 = 전체 카메라 팔 뻗기, 발이 이 안 = 선반 위 상품 그림의 가짜 사람.'
