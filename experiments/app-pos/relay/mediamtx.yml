# HawkEye RTSP 중계기 설정 (MediaMTX v1.21)
#
# 카메라 한 대 영상을 파이프라인과 관리자 앱에 함께 나눠 준다.
#   rtsp://<이 PC>:9554/cam1
#
# 포트 9554: RTSP 기본값 8554 는 안드로이드 에뮬레이터(gRPC)가 쓰고 있어 겹친다.
#
# 카메라 주소·계정은 여기에 쓰지 않는다 (Public 저장소). run-camera.ps1 이 환경변수로 넘긴다.

logLevel: info

rtsp: yes
rtspAddress: :9554
# 앱·파이프라인·카메라 모두 TCP 로 주고받는다. UDP 를 끄면 모든 네트워크에 여는 UDP 포트(8000·8001)가 없어진다.
rtspTransports: [tcp]

# 쓰지 않는 기능은 끈다
rtmp: no
hls: no

# PC 웹 대시보드(브라우저)용 WebRTC. 이 PC 안(127.0.0.1)에서만 연다.
# 대시보드: http://127.0.0.1:8000  ←  WHEP: http://127.0.0.1:8889/cam1/whep
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: ["http://127.0.0.1:8000", "http://localhost:8000"]
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: ["127.0.0.1"]
srt: no
# v1.21 부터 기본으로 켜지는 MoQ 는 실행 폴더에 인증서·개인 키(auto.crt/auto.key)를 만든다. 쓰지 않으므로 끈다.
moq: no
api: no
metrics: no
playback: no

paths:
  # 녹화 모드: run-replay.ps1 의 ffmpeg 가 여기로 영상을 보낸다.
  # 카메라 모드: 환경변수 MTX_PATHS_CAM1_SOURCE=rtsp://... 로 카메라를 끌어온다.
  cam1:
    source: publisher
    sourceOnDemand: no
